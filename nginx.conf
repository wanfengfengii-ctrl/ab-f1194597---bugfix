# Reverse proxy in front of the two API instances. Plain round-robin gives
# every instance traffic, which is exactly what acceptance asserts. The
# service itself performs no sequencing logic; PostgreSQL remains the arbiter.

upstream telemetry_api {
  server api1:8080;
  server api2:8080;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Batches may hold up to 500 events; allow the service-level body limit plus
  # HTTP overhead rather than rejecting at the proxy first.
  client_max_body_size 20m;

  # Long-poll /wait may block for up to 30s; give headroom.
  proxy_read_timeout 65s;
  proxy_send_timeout 65s;

  location = /healthz {
    proxy_pass http://telemetry_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass http://telemetry_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
